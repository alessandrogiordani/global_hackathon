[project]
name = "vulnerability-scanner-mcp"
version = "0.1.0"
description = "MCP server for scanning code repositories for dependency vulnerabilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "databricks-sdk>=0.35.0",
    "pydantic>=2.9.0",
    "aiohttp>=3.10.0",
    "tomli>=2.0.0",
    "packaging>=24.0",
    "pygments>=2.17.0",
    "javalang>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "databricks-mcp>=0.1.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "requests>=2.32.0",
]
# PySpark is provided by Databricks runtime
# Only needed for local development/testing
databricks = [
    "pyspark>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "services", "models"]

[project.scripts]
vulnerability-scanner-mcp = "server.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

